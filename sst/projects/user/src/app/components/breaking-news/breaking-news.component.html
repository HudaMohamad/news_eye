
<div class="background">
  <div id="breakingTicker">
    <div id="breakingTitle">الأخبار العاجلة</div>

    <div id="newsTicker">
      <div class="ticker-track">

    <!-- للشاشات الكبيرة -->
<div class="ticker-item desktop-only" *ngFor="let pun of puns">

    <img src="assets/brand/ain-eye.png" alt="عين الحدث" class="sst-logo">
  </div>
  <span class="story desktop-story">{{ pun }}</span>
</div>

<!-- للشاشات الصغيرة -->

    <img src="assets/brand/ain-eye.png" alt="عين الحدث" class="sst-logo">
  </div>
  <span class="story mobile-story">{{ pun }}</span>
</div>


        <!-- نكرر نفس الأخبار لمنع الفراغ -->

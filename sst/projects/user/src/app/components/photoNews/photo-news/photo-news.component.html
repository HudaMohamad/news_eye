<div class="cat-titel">
  <h4 class="titel">الأخبار المصورة</h4>
</div>

<div class="news-grid">
  <article class="news-card" *ngFor="let card of newsCards">
    <a class="news-card-img" [routerLink]="[card.link]">
      <img [src]="card.img" [alt]="card.title">
    </a>

    <h4 class="news-card-title">
      <a [routerLink]="[card.link]">{{ card.title }}</a>
    </h4>

    <p class="news-meta">
      <span><i class="fas fa-user"></i>{{ card.author }}</span>
      <span><i class="fas fa-clock"></i>{{ card.date | timeAgo }}</span>
    </p>
  </article>
</div>

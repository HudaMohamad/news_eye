<div class="background">
  <div class="container mt-4">
    <h3>تغيير بيانات الأدمن</h3>

    <form [formGroup]="form" (ngSubmit)="save()">

      <!-- البريد القديم -->
      <div class="mb-3">
        <input type="email"
               formControlName="oldEmail"
               class="form-control"
               placeholder="البريد القديم">
      </div>
      <div *ngIf="form.get('oldEmail')?.invalid && form.get('oldEmail')?.touched"
           class="text-danger small">
        ⚠️ أدخل بريدًا إلكترونيًا صحيح
      </div>

      <!-- كلمة السر القديمة -->
      <div class="mb-3 password-wrapper">
        <input [type]="showOldPassword ? 'text' : 'password'"
               formControlName="oldPassword"
               class="form-control"
               placeholder="كلمة السر القديمة">
        <i class="bi" 
           [ngClass]="showOldPassword ? 'bi-eye-slash' : 'bi-eye'" 
           (click)="toggleOldPassword()"></i>
      </div>
      <div *ngIf="form.get('oldPassword')?.invalid && form.get('oldPassword')?.touched"
           class="text-danger small">
        ⚠️ كلمة المرور مطلوبة
      </div>

      <!-- البريد الجديد -->
      <div class="mb-3">
        <input type="email"
               formControlName="newEmail"
               class="form-control"
               placeholder="البريد الجديد">
      </div>
      <div *ngIf="form.get('newEmail')?.invalid && form.get('newEmail')?.touched"
           class="text-danger small">
        ⚠️ أدخل بريدًا إلكترونيًا صحيح
      </div>

      <!-- كلمة السر الجديدة -->
      <div class="mb-3 password-wrapper">
        <input [type]="showNewPassword ? 'text' : 'password'"
               formControlName="password"
               class="form-control"
               placeholder="كلمة السر الجديدة">
        <i class="bi" 
           [ngClass]="showNewPassword ? 'bi-eye-slash' : 'bi-eye'" 
           (click)="toggleNewPassword()"></i>
      </div>
      <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
           class="text-danger small">
        ⚠️ كلمة السر يجب أن تكون 3 أحرف على الأقل
      </div>

      <!-- تأكيد كلمة السر الجديدة -->
      <div class="mb-3 password-wrapper">
        <input [type]="showConfirmPassword ? 'text' : 'password'"
               formControlName="confirmPassword"
               class="form-control"
               placeholder="تأكيد كلمة السر">
        <i class="bi" 
           [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'" 
           (click)="toggleConfirmPassword()"></i>
      </div>
      <div *ngIf="form.get('confirmPassword')?.errors?.['mismatch'] && form.get('confirmPassword')?.touched"
           class="text-danger small">
        ⚠️ كلمة المرور غير متطابقة
      </div>

      <button type="submit"
              class="btn btn-primary"
              [disabled]="form.invalid">
        حفظ التغييرات
      </button>

      <div *ngIf="successMessage" class="alert alert-success mt-2">
        {{ successMessage }}
      </div>

    </form>
  </div>
</div>
